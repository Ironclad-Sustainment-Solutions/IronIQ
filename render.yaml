databases:
  - name: ironiq-insight-db
    databaseName: ironiq_insight
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: ironiq-insight
    runtime: node
    plan: starter
    buildCommand: (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends golang-go) || (apt-get update -qq && apt-get install -y --no-install-recommends golang-go) || echo "Could not install Go -- edge agent download binaries will not be built this deploy, app build continues regardless"; npm ci && ./scripts/build-edge-binaries.sh && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: ironiq-insight-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5
      - key: OPENAI_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: IRONIQ_IDLE_GAP_MINUTES
        value: "15"
      - key: IRONIQ_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
