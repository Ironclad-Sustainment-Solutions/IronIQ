name: CI

# Runs on every PR and push to main: lint, typecheck, unit tests,
# production build, and a full schema-application check against a real
# Postgres instance. Nothing enforced tsc/build/tests on PRs before this
# was first added -- several real bugs fixed this session (a pilot_id
# regression in a column allowlist, a broken production build under
# certain environments, a schema-loading tool that never worked against
# a fresh database) were only caught by manual review, not automated
# checks. This closes that gap going forward for the categories of
# mistakes that ARE automatable.
#
# Lint was deliberately left out when this workflow was first added --
# at the time the codebase had ~8500 pre-existing Prettier-only
# formatting findings unrelated to any given PR's diff, and gating CI on
# that would have failed every PR for reasons that had nothing to do
# with what changed. A dedicated `prettier --write .` cleanup pass fixed
# that (down to 17 real findings, all @typescript-eslint/no-explicit-any,
# plus a handful of warnings), so lint is now added as a real, meaningful
# check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        # No DATABASE_URL/SESSION_SECRET/etc. needed here -- `vite build`
        # is a static build step. Those are only read lazily at request
        # time (see src/lib/db.server.ts's getPool(), src/lib/auth/
        # session.ts's sessionConfig()), never at build time.
        run: npm run build

  schema-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm install pg

      # Split out from the full schema application so a failure here
      # points straight at container/extension setup rather than getting
      # lost in schema.sql's own (much longer, harder to scan) output.
      - name: Sanity-check the Postgres service container is actually reachable
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          echo "psql client version:"
          psql --version
          echo "Server version and basic connectivity:"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "SELECT version();"
          echo "Confirming the vector extension is available on this image:"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "SELECT extname FROM pg_extension;"

      - name: Apply db/schema.sql + every db/schema_additions_*.sql against a fresh database
        run: node run-schema.mjs "postgresql://postgres:postgres@localhost:5432/postgres"
