name: Load database schema

# Manual trigger only — go to the Actions tab on GitHub and click "Run workflow".
on:
  workflow_dispatch:

jobs:
  load-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pg driver
        run: npm install pg

      - name: Apply schema and grant roles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node run-schema.mjs "$DATABASE_URL"
